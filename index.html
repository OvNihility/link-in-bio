<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name | Links</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #fff;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .profile {
      margin-bottom: 30px;
      animation: fadeIn 0.8s ease-out;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 600;
      border: 4px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .bio {
      color: #a0a0b8;
      font-size: 0.95rem;
      line-height: 1.5;
      max-width: 320px;
      margin: 0 auto;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 30px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px 20px;
      text-decoration: none;
      color: #fff;
      font-weight: 500;
      font-size: 1rem;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .link:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 30px rgba(102, 126, 234, 0.25);
    }

    .link i {
      font-size: 1.2rem;
      width: 24px;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }

    .socials a {
      color: #a0a0b8;
      font-size: 1.4rem;
      transition: color 0.2s, transform 0.2s;
    }

    .socials a:hover {
      color: #fff;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 30px;
      color: #666;
      font-size: 0.8rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 480px) {
      .container { padding: 20px 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile">
      <div class="avatar">YN</div>
      <h1>Your Name</h1>
      <p class="bio">Creator, designer & storyteller. Sharing ideas, projects, and behind-the-scenes.</p>
    </div>

    <div class="links">
      <a href="#" class="link">
        <i class="fab fa-instagram"></i> Instagram
      </a>
      <a href="#" class="link">
        <i class="fab fa-youtube"></i> YouTube
      </a>
      <a href="#" class="link">
        <i class="fas fa-globe"></i> Personal Website
      </a>
      <a href="#" class="link">
        <i class="fas fa-shopping-bag"></i> Shop / Merch
      </a>
      <a href="#" class="link">
        <i class="fas fa-envelope"></i> Newsletter
      </a>
      <a href="#" class="link">
        <i class="fab fa-tiktok"></i> TikTok
      </a>
    </div>

    <div class="socials">
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-linkedin"></i></a>
      <a href="#"><i class="fab fa-github"></i></a>
      <a href="#"><i class="fas fa-podcast"></i></a>
    </div>

    <div class="footer">
      Made with ♥ · Link in bio
    </div>
  </div>
</body>
</html>
